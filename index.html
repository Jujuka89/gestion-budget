<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget de la maison</title>
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#1d2b26;--mute:#6b7a73;--line:#d9e1dc;--ok:#1f6f55;--warn:#c47a12;--bad:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--ink:#e6efe9;--mute:#93a39b;--line:#2b3731;--ok:#4fc29a;--warn:#e0a443;--bad:#e8736a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Iowan Old Style',serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.05rem;margin:0 0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
button{cursor:pointer;background:var(--ok);color:#fff;border-color:var(--ok)}
button.ghost{background:none;color:var(--mute);border-color:var(--line)}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 130px}
.big{font-size:2.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.mute{color:var(--mute);font-size:.9rem}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
li:first-child{border-top:0}
li .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
li button{padding:3px 9px;margin-left:8px}
.cat{display:flex;justify-content:space-between;padding:4px 0}
#err{color:var(--bad);min-height:1.4em;margin:8px 0 0}
.rowbtn{display:flex;justify-content:space-between;gap:10px;flex:1;width:100%;background:none;color:var(--ink);border:0;padding:6px 0;text-align:left;border-radius:0}
.rowbtn:hover .nm{text-decoration:underline}
